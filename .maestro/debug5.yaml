- extendedWaitUntil:
    visible: "Confirmar e iniciar treino"
    timeout: 5000
- tapOn: "Confirmar e iniciar treino"
- takeScreenshot: "after_confirm.png"
- extendedWaitUntil:
    visible: "Pausar"
    timeout: 15000
- takeScreenshot: "after_pausar.png"
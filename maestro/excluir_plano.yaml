appId: com.aistudio.primeiro5k.kptwlz
---
# Fluxo de teste: Criar plano e excluir plano
# 1. Onboarding completo (Welcome -> Quiz 1-3 -> DaysSelection -> DurationSelection -> PlanPreview -> Aceitar)
#    (Para plano_5k, pula GoalSelection e vai direto para QuizQuestion1)
# 2. Navegar para aba Plano
# 3. Abrir plano completo
# 4. Abrir menu gerenciar
# 5. Excluir plano (2 etapas)
# 6. Verificar que voltou para Welcome/Today

- launchApp:
    clearState: false
    stopApp: true

# Diálogo de permissões (Android 13+): permitir ou "Agora não".
- back:
    optional: true

# Tela inicial: Welcome. O botão "Começar" inicia o onboarding.
- extendedWaitUntil:
    visible:
      text: "Começar"
    timeout: 10000

- inputText: "Teste"
- tapOn:
    text: "Começar"

# Quiz Pergunta 1: "Há quanto tempo você não corre?" (já está na QuizQuestion1)
- extendedWaitUntil:
    visible:
      text: "Há quanto tempo"
    timeout: 10000
- tapOn:
    id: "quiz_option_1_0"  # Nunca corri
- extendedWaitUntil:
    visible:
      enabled: true
      id: "quiz_next_button"
    timeout: 5000
- tapOn:
    id: "quiz_next_button"

# Quiz Pergunta 2: "Quanto você se exercita por semana?"
- extendedWaitUntil:
    visible:
      text: "exercita por semana"
    timeout: 10000
- tapOn:
    id: "quiz_option_2_1"  # 1 a 2 vezes
- extendedWaitUntil:
    visible:
      enabled: true
      id: "quiz_next_button"
    timeout: 5000
- tapOn:
    id: "quiz_next_button"

# Quiz Pergunta 3: "Que tipo de exercício você pratica?"
- extendedWaitUntil:
    visible:
      text: "tipo de exercício"
    timeout: 10000
- tapOn:
    id: "quiz_option_3_1"  # Baixo impacto, como caminhada
- extendedWaitUntil:
    visible:
      enabled: true
      id: "quiz_next_button"
    timeout: 5000
- tapOn:
    id: "quiz_next_button"

# DaysSelection: Selecionar dias
- extendedWaitUntil:
    visible:
      id: "days_next_button"
    timeout: 10000
- tapOn:
    id: "days_next_button"

# DurationSelection: Duração do plano
- extendedWaitUntil:
    visible:
      id: "duration_next_button"
    timeout: 10000
- tapOn:
    id: "duration_next_button"

# PlanPreview: "Li e entendi" + "Começar meu plano"
- extendedWaitUntil:
    visible:
      id: "checkbox_li_entendi"
    timeout: 10000
- tapOn:
    id: "checkbox_li_entendi"
- extendedWaitUntil:
    visible:
      id: "btn_iniciar_plano"
    timeout: 5000
- tapOn:
    id: "btn_iniciar_plano"

# Aguarda carregar e ir para Today
- extendedWaitUntil:
    visible:
      id: "tab_hoje"
    timeout: 15000

# Navegar para aba Plano
- tapOn:
    id: "tab_plano"
- extendedWaitUntil:
    visible:
      id: "tab_plano"
    timeout: 5000

# Abrir plano completo
- tapOn:
    id: "btn_ver_plano_completo"
- extendedWaitUntil:
    visible:
      id: "btn_voltar"
    timeout: 5000

# Abrir menu gerenciar (ícone de 3 pontos)
- tapOn:
    id: "btn_gerenciar_plano"
- extendedWaitUntil:
    visible:
      id: "btn_excluir_plano"
    timeout: 5000

# Clicar em Excluir plano (passo 1)
- tapOn:
    id: "btn_excluir_plano"
- extendedWaitUntil:
    visible:
      id: "btn_confirm_delete_plan_step1"
    timeout: 5000

# Confirmar passo 1
- tapOn:
    id: "btn_confirm_delete_plan_step1"
- extendedWaitUntil:
    visible:
      id: "btn_confirm_delete_plan_step2"
    timeout: 5000

# Confirmar passo 2 (exclusão definitiva)
- tapOn:
    id: "btn_confirm_delete_plan_step2"

# Verificar que voltou para Welcome (sem plano ativo)
- extendedWaitUntil:
    visible:
      text: "Começar"
    timeout: 15000